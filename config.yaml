data:
  raw_path: data/raw/bank-additional-full.csv
  processed_path: data/processed/bank_marketing_preprocessed.csv

preprocessing:
  leakage_columns: ["duration"]
  numeric_impute_strategy: median
  categorical_impute_strategy: most_frequent

split:
  test_size: 0.2
  random_state: 42

clustering:
  k_min: 2
  k_max: 10
  random_state: 42

outliers:
  contamination: 0.05
  random_state: 42

feature_selection:
  C: 0.1
  random_state: 42

random_forest:
  n_estimators: 200
  max_depth: 15
  min_samples_leaf: 5
  random_state: 42

smote:
  random_state: 42

cross_validation:
  cv: 5

hyperparameter_search:
  n_iter: 20
  cv: 3
  scoring: f1
  random_state: 42
  param_distributions:
    n_estimators: [100, 200, 300, 400, 500]
    max_depth: [null, 10, 15, 20, 25, 30]
    min_samples_split: [2, 5, 10, 20]
    min_samples_leaf: [1, 2, 4, 6]
    max_features: ["sqrt", "log2"]
    bootstrap: [true, false]
